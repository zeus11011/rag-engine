<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f6fb; --card: #ffffff; --text: #1d2033; --muted: #6b7088; --border: #e4e6f0;
        --accent: #5b5bf0; --accent-2: #a855f7; --accent-soft: #eef0ff; --danger: #e5484d; --danger-soft: #fdecec;
        --ok: #15803d; --ok-soft: #e7f6ec; --shadow: 0 1px 2px rgba(20,20,50,.04), 0 8px 24px rgba(20,20,50,.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f17; --card: #171925; --text: #e8e9f2; --muted: #9196ad; --border: #272a3b;
          --accent: #7c7cff; --accent-2: #c084fc; --accent-soft: #23244a; --danger: #ff6b6f; --danger-soft: #3a1c20;
          --ok: #4ade80; --ok-soft: #14301f; --shadow: 0 8px 24px rgba(0,0,0,.35);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--text); line-height: 1.55;
        background: radial-gradient(1200px 500px at 50% -200px, var(--accent-soft), transparent), var(--bg);
      }
      .wrap { max-width: 820px; margin: 0 auto; padding: 48px 16px 64px; }
      header { text-align: center; margin-bottom: 36px; }
      header h1 {
        margin: 0; font-size: 2.4rem; font-weight: 700; letter-spacing: -.02em;
        background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      header p { margin: 6px 0 0; color: var(--muted); }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
      .card h2 { margin: 0 0 14px; font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .drop {
        display: block; border: 2px dashed var(--border); border-radius: 12px; padding: 28px; text-align: center;
        cursor: pointer; color: var(--muted); transition: border-color .15s, background .15s;
      }
      .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
      .drop strong { color: var(--accent); }
      .drop input { display: none; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: .82rem; font-weight: 500; }
      .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
        background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; transition: transform .1s, opacity .15s;
      }
      button:hover:not(:disabled) { transform: translateY(-1px); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.ghost { background: transparent; color: var(--danger); border: 1px solid var(--border); }
      button.ghost:hover:not(:disabled) { background: var(--danger-soft); }
      button:focus-visible, textarea:focus-visible, .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
      .docs { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--border); }
      .docs li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--border); }
      .docs .name { flex: 1; font-weight: 500; overflow-wrap: anywhere; }
      button.icon { background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 8px; }
      button.icon:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); transform: none; }
      textarea {
        width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; resize: vertical; min-height: 90px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      .hint { color: var(--muted); font-size: .8rem; }
      .msg { border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; font-size: .92rem; }
      .msg.ok { background: var(--ok-soft); color: var(--ok); }
      .msg.err { background: var(--danger-soft); color: var(--danger); }
      .msg.busy { background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; gap: 10px; }
      .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .answer { white-space: pre-wrap; font-size: 1.02rem; }
      .cursor { color: var(--accent); animation: blink 1s steps(2) infinite; }
      @keyframes blink { to { opacity: 0; } }
      .sources { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
      .sources h3 { margin: 0 0 10px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
      details { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
      summary { cursor: pointer; padding: 10px 14px; font-weight: 500; font-size: .92rem; }
      summary:hover { background: var(--accent-soft); }
      summary { display: flex; align-items: center; gap: 8px; }
      summary .name { flex: 1; overflow-wrap: anywhere; }
      summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
      details[open] > summary::before { transform: rotate(90deg); }
      details.gone summary .name { text-decoration: line-through; color: var(--muted); }
      details pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; font-size: .82rem; color: var(--muted); background: var(--bg); border-top: 1px solid var(--border); }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
